<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password — Finora</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/mobile.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-bg"><div class="orb orb-1"></div><div class="orb orb-2"></div></div>
    <button class="theme-toggle theme-toggle-auth" id="themeToggle"><i class="fas fa-moon" id="themeIcon"></i></button>
    <div class="auth-container">
      <a href="index.html" class="auth-logo"><div class="logo-icon"><i class="fas fa-chart-line"></i></div>Finora</a>
      <div class="auth-card">
        <div class="auth-header">
          <div style="font-size:2.5rem;margin-bottom:1rem"><i class="fas fa-key" style="color:var(--accent-gold)"></i></div>
          <h1>Forgot Password?</h1>
          <p>Enter your email and we'll send you reset instructions</p>
        </div>
        <div id="successState" style="display:none;text-align:center;padding:1rem 0">
          <div style="font-size:2.5rem;margin-bottom:1rem"><i class="fas fa-check-circle" style="color:var(--accent-green)"></i></div>
          <h3 style="margin-bottom:0.5rem">Reset Link Sent!</h3>
          <p style="color:var(--text-secondary);font-size:0.9rem;margin-bottom:1.5rem">In this demo, click the button below to proceed to the reset password page.</p>
          <a href="reset-password.html" class="btn-primary" style="width:100%;justify-content:center;margin-bottom:0.75rem">Reset Password</a>
          <a href="login.html" class="btn-outline" style="width:100%;justify-content:center">Back to Login</a>
        </div>
        <form class="auth-form" id="forgotForm" novalidate>
          <div class="input-group" id="emailGroup">
            <label for="email">Email Address</label>
            <div class="input-wrapper">
              <i class="fas fa-envelope input-icon"></i>
              <input type="email" id="email" class="form-input" placeholder="you@example.com" />
            </div>
            <span class="field-error" id="emailError">Please enter a valid email</span>
          </div>
          <button type="submit" class="btn-primary auth-submit" id="submitBtn">
            <i class="fas fa-paper-plane"></i> Send Reset Link
          </button>
        </form>
        <div class="auth-footer"><a href="login.html"><i class="fas fa-arrow-left"></i> Back to Login</a></div>
      </div>
    </div>
  </div>
  <script src="js/theme.js"></script>
  <script>
    document.getElementById('forgotForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const emailGroup = document.getElementById('emailGroup');
      emailGroup.classList.remove('has-error');
      if (!email || !/\S+@\S+\.\S+/.test(email)) { emailGroup.classList.add('has-error'); return; }
      const btn = document.getElementById('submitBtn');
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';
      btn.disabled = true;
      setTimeout(() => {
        document.getElementById('forgotForm').style.display = 'none';
        document.getElementById('successState').style.display = 'block';
      }, 1200);
    });
  </script>
</body>
</html>
