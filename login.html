<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Finora</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/mobile.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-bg">
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
    </div>

    <button class="theme-toggle theme-toggle-auth" id="themeToggle" aria-label="Toggle theme">
      <i class="fas fa-moon" id="themeIcon"></i>
    </button>

    <div class="auth-container">
      <a href="index.html" class="auth-logo">
        <div class="logo-icon"><i class="fas fa-chart-line"></i></div>
        Finora
      </a>

      <div class="auth-card">
        <div class="auth-header">
          <h1>Welcome Back</h1>
          <p>Sign in to your Finora account</p>
        </div>

        <div class="auth-error-banner" id="errorBanner">
          <i class="fas fa-exclamation-circle"></i>
          <span id="errorMsg">Invalid email or password</span>
        </div>

        <form class="auth-form" id="loginForm" novalidate>
          <div class="input-group" id="emailGroup">
            <label for="email">Email Address</label>
            <div class="input-wrapper">
              <i class="fas fa-envelope input-icon"></i>
              <input type="email" id="email" class="form-input" placeholder="you@example.com" autocomplete="email" />
            </div>
            <span class="field-error" id="emailError">Please enter a valid email address</span>
          </div>

          <div class="input-group" id="passwordGroup">
            <label for="password">Password</label>
            <div class="input-wrapper">
              <i class="fas fa-lock input-icon"></i>
              <input type="password" id="password" class="form-input" placeholder="Enter your password" autocomplete="current-password" />
              <button type="button" class="input-toggle" id="togglePwd" aria-label="Toggle password visibility">
                <i class="fas fa-eye"></i>
              </button>
            </div>
            <span class="field-error" id="passwordError">Password is required</span>
          </div>

          <div class="form-options">
            <label class="checkbox-label">
              <input type="checkbox" id="rememberMe" />
              Remember me
            </label>
            <a href="forgot-password.html" class="forgot-link">Forgot password?</a>
          </div>

          <button type="submit" class="btn-primary auth-submit" id="submitBtn">
            <i class="fas fa-sign-in-alt"></i> Sign In
          </button>
        </form>

        <div class="auth-footer">
          Don't have an account? <a href="register.html">Create one free</a>
        </div>

        <div class="auth-divider">or try demo</div>
        <button type="button" class="btn-outline" style="width:100%;justify-content:center;" id="demoBtn">
          <i class="fas fa-play-circle"></i> Login with Demo Account
        </button>
      </div>
    </div>
  </div>

  <script src="js/theme.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      handleLogin();
    });
    document.getElementById('demoBtn').addEventListener('click', function() {
      document.getElementById('email').value = 'demo@finora.app';
      document.getElementById('password').value = 'Demo@1234';
      handleLogin();
    });
    document.getElementById('togglePwd').addEventListener('click', function() {
      const pwd = document.getElementById('password');
      const icon = this.querySelector('i');
      if (pwd.type === 'password') { pwd.type = 'text'; icon.className = 'fas fa-eye-slash'; }
      else { pwd.type = 'password'; icon.className = 'fas fa-eye'; }
    });

    function handleLogin() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const emailGroup = document.getElementById('emailGroup');
      const passwordGroup = document.getElementById('passwordGroup');
      const errorBanner = document.getElementById('errorBanner');
      let valid = true;

      emailGroup.classList.remove('has-error');
      passwordGroup.classList.remove('has-error');
      errorBanner.classList.remove('show');

      if (!email || !/\S+@\S+\.\S+/.test(email)) {
        emailGroup.classList.add('has-error');
        valid = false;
      }
      if (!password) {
        passwordGroup.classList.add('has-error');
        valid = false;
      }
      if (!valid) return;

      const btn = document.getElementById('submitBtn');
      btn.classList.add('loading');
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';

      setTimeout(() => {
        // Accept any email/password OR demo credentials
        const users = JSON.parse(localStorage.getItem('finora_users') || '[]');
        const demoUser = { id: 'demo', name: 'Demo User', email: 'demo@finora.app', password: 'Demo@1234', currency: 'INR', avatar: 'DU' };
        const allUsers = [...users, demoUser];
        const user = allUsers.find(u => u.email === email && u.password === password);
        if (user) {
          localStorage.setItem('finora_current_user', JSON.stringify({ id: user.id, name: user.name, email: user.email, currency: user.currency || 'INR', avatar: user.avatar || user.name.substring(0,2).toUpperCase() }));
          window.location.href = 'dashboard.html';
        } else {
          btn.classList.remove('loading');
          btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
          errorBanner.classList.add('show');
          document.getElementById('errorMsg').textContent = 'Invalid email or password. Try demo account.';
        }
      }, 900);
    }
  </script>
</body>
</html>
