<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — Finora</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/mobile.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-bg"><div class="orb orb-1"></div><div class="orb orb-2"></div></div>
    <button class="theme-toggle theme-toggle-auth" id="themeToggle"><i class="fas fa-moon" id="themeIcon"></i></button>
    <div class="auth-container">
      <a href="index.html" class="auth-logo"><div class="logo-icon"><i class="fas fa-chart-line"></i></div>Finora</a>
      <div class="auth-card">
        <div class="auth-header">
          <div style="font-size:2.5rem;margin-bottom:1rem"><i class="fas fa-lock-open" style="color:var(--accent-green)"></i></div>
          <h1>Reset Password</h1>
          <p>Enter your new password below</p>
        </div>
        <div id="successState" style="display:none;text-align:center;padding:1rem 0">
          <div style="font-size:2.5rem;margin-bottom:1rem"><i class="fas fa-check-circle" style="color:var(--accent-green)"></i></div>
          <h3 style="margin-bottom:0.5rem">Password Reset!</h3>
          <p style="color:var(--text-secondary);font-size:0.9rem;margin-bottom:1.5rem">Your password has been updated. You can now sign in.</p>
          <a href="login.html" class="btn-primary" style="width:100%;justify-content:center">Go to Login</a>
        </div>
        <form class="auth-form" id="resetForm" novalidate>
          <div class="input-group" id="pwdGroup">
            <label for="newPassword">New Password</label>
            <div class="input-wrapper">
              <i class="fas fa-lock input-icon"></i>
              <input type="password" id="newPassword" class="form-input" placeholder="Minimum 8 characters" autocomplete="new-password" />
              <button type="button" class="input-toggle" id="togglePwd"><i class="fas fa-eye"></i></button>
            </div>
            <div class="password-strength">
              <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
              <span class="strength-label" id="strengthLabel"></span>
            </div>
            <span class="field-error" id="pwdError">Password must be at least 8 characters</span>
          </div>
          <div class="input-group" id="confirmGroup">
            <label for="confirmPassword">Confirm Password</label>
            <div class="input-wrapper">
              <i class="fas fa-lock input-icon"></i>
              <input type="password" id="confirmPassword" class="form-input" placeholder="Repeat your password" autocomplete="new-password" />
            </div>
            <span class="field-error" id="confirmError">Passwords do not match</span>
          </div>
          <button type="submit" class="btn-primary auth-submit" id="submitBtn">
            <i class="fas fa-shield-alt"></i> Reset Password
          </button>
        </form>
        <div class="auth-footer"><a href="login.html"><i class="fas fa-arrow-left"></i> Back to Login</a></div>
      </div>
    </div>
  </div>
  <script src="js/theme.js"></script>
  <script>
    document.getElementById('newPassword').addEventListener('input', function() {
      const val = this.value;
      const fill = document.getElementById('strengthFill');
      const label = document.getElementById('strengthLabel');
      fill.className = 'strength-fill';
      if (!val) { label.textContent = ''; return; }
      if (val.length < 6) { fill.classList.add('weak'); label.textContent = 'Weak'; }
      else if (val.length < 8) { fill.classList.add('fair'); label.textContent = 'Fair'; }
      else if (/[A-Z]/.test(val) && /[0-9]/.test(val)) { fill.classList.add('strong'); label.textContent = 'Strong'; }
      else { fill.classList.add('good'); label.textContent = 'Good'; }
    });
    document.getElementById('togglePwd').addEventListener('click', function() {
      const pwd = document.getElementById('newPassword');
      const icon = this.querySelector('i');
      if (pwd.type === 'password') { pwd.type = 'text'; icon.className = 'fas fa-eye-slash'; }
      else { pwd.type = 'password'; icon.className = 'fas fa-eye'; }
    });
    document.getElementById('resetForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const pwd = document.getElementById('newPassword').value;
      const confirm = document.getElementById('confirmPassword').value;
      let valid = true;
      document.getElementById('pwdGroup').classList.remove('has-error');
      document.getElementById('confirmGroup').classList.remove('has-error');
      if (!pwd || pwd.length < 8) { document.getElementById('pwdGroup').classList.add('has-error'); valid = false; }
      if (pwd !== confirm) { document.getElementById('confirmGroup').classList.add('has-error'); valid = false; }
      if (!valid) return;
      const btn = document.getElementById('submitBtn');
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Resetting...';
      btn.disabled = true;
      setTimeout(() => {
        document.getElementById('resetForm').style.display = 'none';
        document.getElementById('successState').style.display = 'block';
      }, 1000);
    });
  </script>
</body>
</html>
