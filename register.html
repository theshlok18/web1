<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — Finora</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/mobile.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-bg">
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
    </div>
    <button class="theme-toggle theme-toggle-auth" id="themeToggle" aria-label="Toggle theme">
      <i class="fas fa-moon" id="themeIcon"></i>
    </button>
    <div class="auth-container" style="max-width:500px">
      <a href="index.html" class="auth-logo">
        <div class="logo-icon"><i class="fas fa-chart-line"></i></div>
        Finora
      </a>
      <div class="auth-card">
        <div class="auth-header">
          <h1>Create Account</h1>
          <p>Start your financial journey today</p>
        </div>
        <div class="auth-error-banner" id="errorBanner">
          <i class="fas fa-exclamation-circle"></i>
          <span id="errorMsg"></span>
        </div>
        <form class="auth-form" id="registerForm" novalidate>
          <div class="input-group" id="nameGroup">
            <label for="fullName">Full Name</label>
            <div class="input-wrapper">
              <i class="fas fa-user input-icon"></i>
              <input type="text" id="fullName" class="form-input" placeholder="John Doe" autocomplete="name" />
            </div>
            <span class="field-error" id="nameError">Full name is required</span>
          </div>
          <div class="input-group" id="emailGroup">
            <label for="email">Email Address</label>
            <div class="input-wrapper">
              <i class="fas fa-envelope input-icon"></i>
              <input type="email" id="email" class="form-input" placeholder="you@example.com" autocomplete="email" />
            </div>
            <span class="field-error" id="emailError">Please enter a valid email</span>
          </div>
          <div class="input-group" id="passwordGroup">
            <label for="password">Password</label>
            <div class="input-wrapper">
              <i class="fas fa-lock input-icon"></i>
              <input type="password" id="password" class="form-input" placeholder="Min 8 characters" autocomplete="new-password" />
              <button type="button" class="input-toggle" id="togglePwd">
                <i class="fas fa-eye"></i>
              </button>
            </div>
            <div class="password-strength" id="strengthBar">
              <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
              <span class="strength-label" id="strengthLabel"></span>
            </div>
            <span class="field-error" id="passwordError">Password must be at least 8 characters</span>
          </div>
          <div class="input-group" id="confirmGroup">
            <label for="confirmPassword">Confirm Password</label>
            <div class="input-wrapper">
              <i class="fas fa-lock input-icon"></i>
              <input type="password" id="confirmPassword" class="form-input" placeholder="Repeat your password" autocomplete="new-password" />
            </div>
            <span class="field-error" id="confirmError">Passwords do not match</span>
          </div>
          <label class="checkbox-label">
            <input type="checkbox" id="agreeTerms" />
            I agree to the <a href="#" style="color:var(--accent-green)">Terms of Service</a> and <a href="#" style="color:var(--accent-green)">Privacy Policy</a>
          </label>
          <button type="submit" class="btn-primary auth-submit" id="submitBtn">
            <i class="fas fa-user-plus"></i> Create Account
          </button>
        </form>
        <div class="auth-footer">
          Already have an account? <a href="login.html">Sign in</a>
        </div>
      </div>
    </div>
  </div>
  <script src="js/theme.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.getElementById('password').addEventListener('input', function() {
      const val = this.value;
      const fill = document.getElementById('strengthFill');
      const label = document.getElementById('strengthLabel');
      fill.className = 'strength-fill';
      if (!val) { label.textContent = ''; return; }
      if (val.length < 6) { fill.classList.add('weak'); label.textContent = 'Weak'; }
      else if (val.length < 8) { fill.classList.add('fair'); label.textContent = 'Fair'; }
      else if (/[A-Z]/.test(val) && /[0-9]/.test(val)) { fill.classList.add('strong'); label.textContent = 'Strong'; }
      else { fill.classList.add('good'); label.textContent = 'Good'; }
    });

    document.getElementById('togglePwd').addEventListener('click', function() {
      const pwd = document.getElementById('password');
      const icon = this.querySelector('i');
      if (pwd.type === 'password') { pwd.type = 'text'; icon.className = 'fas fa-eye-slash'; }
      else { pwd.type = 'password'; icon.className = 'fas fa-eye'; }
    });

    document.getElementById('registerForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const name = document.getElementById('fullName').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirmPassword').value;
      const agreed = document.getElementById('agreeTerms').checked;
      const errorBanner = document.getElementById('errorBanner');
      let valid = true;

      ['nameGroup','emailGroup','passwordGroup','confirmGroup'].forEach(id => document.getElementById(id).classList.remove('has-error'));
      errorBanner.classList.remove('show');

      if (!name) { document.getElementById('nameGroup').classList.add('has-error'); valid = false; }
      if (!email || !/\S+@\S+\.\S+/.test(email)) { document.getElementById('emailGroup').classList.add('has-error'); valid = false; }
      if (!password || password.length < 8) { document.getElementById('passwordGroup').classList.add('has-error'); valid = false; }
      if (password !== confirm) { document.getElementById('confirmGroup').classList.add('has-error'); valid = false; }
      if (!agreed) {
        errorBanner.classList.add('show');
        document.getElementById('errorMsg').textContent = 'Please agree to the Terms of Service';
        valid = false;
      }
      if (!valid) return;

      const users = JSON.parse(localStorage.getItem('finora_users') || '[]');
      if (users.find(u => u.email === email)) {
        errorBanner.classList.add('show');
        document.getElementById('errorMsg').textContent = 'An account with this email already exists';
        return;
      }

      const btn = document.getElementById('submitBtn');
      btn.classList.add('loading');
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating...';

      setTimeout(() => {
        const newUser = {
          id: 'user_' + Date.now(),
          name, email, password,
          currency: 'INR',
          avatar: name.substring(0,2).toUpperCase(),
          createdAt: new Date().toISOString()
        };
        users.push(newUser);
        localStorage.setItem('finora_users', JSON.stringify(users));
        localStorage.setItem('finora_current_user', JSON.stringify({ id: newUser.id, name, email, currency: 'INR', avatar: newUser.avatar }));
        window.location.href = 'dashboard.html';
      }, 900);
    });
  </script>
</body>
</html>
